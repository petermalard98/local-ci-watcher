<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local CI Watcher</title>
<style>
  :root { --bg:#14161a; --card:#1d2026; --line:#2b2f37; --fg:#e4e6ea; --dim:#8b919c;
          --ok:#3fb950; --fail:#f85149; --run:#d29922; --skip:#6e7681; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 system-ui, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 16px; display:flex; gap:12px; align-items:center; }
  #conn { font-size:12px; color:var(--dim); font-weight:400; }
  .job { background:var(--card); border:1px solid var(--line); border-radius:8px; margin-bottom:12px; }
  .job > summary { list-style:none; cursor:pointer; padding:12px 16px; display:flex; gap:12px; align-items:center; }
  .job > summary::-webkit-details-marker { display:none; }
  .meta { color:var(--dim); font-size:12px; }
  .meta a { color:var(--dim); }
  .badge { font-size:12px; font-weight:600; padding:2px 8px; border-radius:999px; border:1px solid currentColor; }
  .s-succeeded { color:var(--ok); } .s-failed { color:var(--fail); }
  .s-running { color:var(--run); } .s-skipped, .s-unknown, .s-canceled, .s-cancelled { color:var(--skip); }
  .body { padding: 0 16px 16px; }
  ol { margin:0; padding:0; list-style:none; }
  li { padding:3px 0; display:flex; gap:8px; }
  li.s-failed { font-weight:600; }
  .dot { width:10px; flex:none; }
  pre { background:#0d0f12; border:1px solid var(--line); border-radius:6px; padding:10px; margin:12px 0 0;
        max-height:320px; overflow:auto; font:12px/1.45 ui-monospace, Consolas, monospace; white-space:pre-wrap; }
  .log > summary { margin-top:12px; cursor:pointer; color:var(--dim); font:12px ui-monospace, Consolas, monospace;
                   white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .log pre { margin-top:6px; }
  .running .dot { animation: pulse 1s infinite alternate; }
  @keyframes pulse { to { opacity:.3; } }
</style>
</head>
<body>
<main>
  <h1>Local CI Watcher <span id="conn">connecting…</span> <span id="ts" class="meta"></span> <button id="notify" hidden>Enable notifications</button></h1>
  <div id="jobs"></div>
</main>
<script>
const icon = { succeeded:"✓", failed:"✗", running:"●", skipped:"–" };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const open = new Set();
let prev = {};
const since = {};          // job id -> ms when status last changed
const collapsed = new Set(); // finished jobs auto-collapsed after idle
let last = [], lastInteract = Date.now();
const IDLE_MS = 60000;

function render(jobs) {
  last = jobs;
  document.getElementById("jobs").innerHTML = jobs.map(j => {
    const isOpen = j.status === "running" || (!collapsed.has(j.id) && (j.status === "failed" || open.has(j.id)));
    const meta = [j.repository, j.ref?.replace("refs/heads/", ""), j.sha?.slice(0, 7),
                  j.run_number && "#" + j.run_number].filter(Boolean).map(esc).join(" · ");
    return `<details class="job ${j.status}" data-id="${esc(j.id)}" ${isOpen ? "open" : ""}>
      <summary><span class="badge s-${j.status}">${esc(j.status)}</span>
        <strong>${esc(j.name || "job")}</strong>
        <span class="meta">${meta} ${j.url ? `· <a href="${esc(j.url)}" target="_blank">GitHub</a>` : ""}</span></summary>
      <div class="body"><ol>${j.steps.map(s =>
        `<li class="s-${s.result}"><span class="dot">${icon[s.result] || "·"}</span>${esc(s.name)}</li>`).join("")}</ol>
        ${j.tail.length && (j.status === "running" || j.status === "failed")
          ? `<details class="log" data-id="log:${esc(j.id)}" ${open.has("log:" + j.id) ? "open" : ""}>
               <summary>${esc(j.tail[j.tail.length - 1])}</summary><pre>${esc(j.tail.join("\n"))}</pre></details>` : ""}</div></details>`;
  }).join("") || `<p class="meta">No jobs yet.</p>`;
  document.querySelectorAll("pre").forEach(p => p.scrollTop = p.scrollHeight);
  const cur = jobs[0];
  document.title = cur ? `${icon[cur.status] || ""} ${cur.name} – CI` : "Local CI Watcher";
}

function notifyChanges(jobs) {
  for (const j of jobs) {
    const was = prev[j.id];
    if (was === "running" && j.status !== "running" && Notification.permission === "granted")
      new Notification(`${j.name}: ${j.status}`, { body: j.repository || "" });
    prev[j.id] = j.status;
  }
}

document.addEventListener("toggle", e => {
  const id = e.target.dataset?.id;
  if (!id) return;
  if (e.target.open) { open.add(id); collapsed.delete(id); } else open.delete(id);
}, true);

["pointerdown", "keydown", "wheel"].forEach(t =>
  addEventListener(t, () => lastInteract = Date.now(), true));

setInterval(() => {
  const now = Date.now();
  let changed = false;
  for (const j of last)
    if (j.status !== "running" && !collapsed.has(j.id) && now - Math.max(lastInteract, since[j.id] || 0) > IDLE_MS)
      collapsed.add(j.id), changed = true;
  if (changed) render(last);
}, 5000);

const btn = document.getElementById("notify");
if ("Notification" in window && Notification.permission === "default") {
  btn.hidden = false;
  btn.onclick = () => Notification.requestPermission().then(() => btn.hidden = true);
}

const conn = document.getElementById("conn");
const es = new EventSource("/events");
es.onopen = () => conn.textContent = "live";
es.onerror = () => conn.textContent = "disconnected, retrying…";
let first = true;
es.onmessage = e => {
  const jobs = JSON.parse(e.data);
  jobs.forEach(j => { if (prev[j.id] !== j.status) { since[j.id] = Date.now(); collapsed.delete(j.id); } });
  if (first) { jobs.forEach(j => prev[j.id] = j.status); first = false; }
  else notifyChanges(jobs);
  render(jobs);
  document.getElementById("ts").textContent = "updated " + new Date().toLocaleTimeString();
};
</script>
</body>
</html>
